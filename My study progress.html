<!DOCTYPE html>
<html lang="en">

<head>
    <title>My Study Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f0f4f5;
            font-family: Arial, sans-serif;
            color: #263238;
        }

        .jumbotron {
            background-color: #263f50;
            border-bottom: 7px solid #20b2aa;
            border-radius: 0;
            padding: 45px 30px;
        }

        .jumbotron h1 {
            color: #ffffff;
            font-size: 36px;
        }

        .jumbotron p {
            color: #d6e5e9;
            font-weight: normal;
        }

        .section-title {
            color: #167d7f;
            margin-top: 35px;
            margin-bottom: 20px;
            border-bottom: 2px solid #20b2aa;
            padding-bottom: 8px;
        }

        p {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .progress {
            height: 22px;
            border-radius: 12px;
            background-color: #dce5e8;
        }

        .progress-bar {
            border-radius: 12px;
            font-size: 13px;
        }

        .container {
            padding-bottom: 40px;
        }
    </style>
</head>

<body>

    <div class="jumbotron">
        <div class="container">

            <h1>My Study Dashboard</h1>

            <p class="lead">
                Welcome to my learning space! Check out my subjects and track my achievements.
            </p>


            <button class="btn btn-info">Mathematics</button>
            <button class="btn btn-success">Science</button>
            <button class="btn btn-primary">English</button>
            <button class="btn btn-warning">Web Development</button>

        </div>
    </div>

    <div class="container">

        <h2 class="section-title">
            Completed Lessons
            <span class="badge badge-success">24</span>
        </h2>

        <p>Mathematics <span class="badge badge-info">8 lessons</span></p>

        <p>Science <span class="badge badge-success">6 lessons</span></p>

        <p>English <span class="badge badge-warning">5 lessons</span></p>

        <p>Web Development <span class="badge badge-primary">5 lessons</span></p>


        <!-- TOPIC 4: PROGRESS BARS -->
        <h2 class="section-title">My Learning Progress</h2>

        <p>Mathematics</p>
        <div class="progress mb-4">
            <div class="progress-bar bg-info" style="width: 75%">75%</div>
        </div>

        <p>Science</p>
        <div class="progress mb-4">
            <div class="progress-bar bg-success" style="width: 60%">60%</div>
        </div>

        <p>English</p>
        <div class="progress mb-4">
            <div class="progress-bar bg-warning" style="width: 85%">85%</div>
        </div>

        <p>Web Development</p>
        <div class="progress mb-4">
            <div class="progress-bar bg-primary" style="width: 70%">70%</div>
        </div>

    </div>

</body>

</html>
